<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf9f7" />

    <!--
      Page de renvoi : cet onglet vivait sous /anecdotes/ avant de s'appeler
      Digressions. On ne casse pas un lien qu'on a pu donner à des étudiants.

      `noindex` mais pas `nofollow` : les moteurs doivent suivre le renvoi et
      créditer la nouvelle adresse, sans garder celle-ci dans leur index. Le
      canonique dit la même chose. C'est ce qu'on peut faire de mieux sans
      serveur — GitHub Pages ne sait pas répondre 301.
    -->
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="https://morphologie.commutator.io/digressions/" />
    <meta http-equiv="refresh" content="0; url=/digressions/" />
    <title>Cette page a déménagé — Digressions</title>

    <script>
      // Avant le rendu, et en conservant l'ancre : un lien partagé pointait
      // peut-être un moment précis. `replace` plutôt que `href` pour que le
      // bouton Retour ramène d'où l'on vient, et non sur ce renvoi.
      location.replace('/digressions/' + location.hash);
    </script>

    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #faf9f7;
        color: #45403a;
        font:
          16px/1.6 ui-sans-serif,
          system-ui,
          sans-serif;
        text-align: center;
      }
      a {
        color: #9c4221;
      }
    </style>
  </head>
  <body>
    <p>
      L'onglet <strong>Anecdotes</strong> s'appelle désormais
      <strong>Digressions</strong>.<br />
      <a href="/digressions/">Continuer vers la page</a>
    </p>
  </body>
</html>
