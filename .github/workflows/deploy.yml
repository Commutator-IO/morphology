name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Checks run on pull requests too; only deployment is reserved for the main
  # branch.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, without cancelling the one in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `--deny-warnings` is essential: without the flag, oxlint prints its
      # warnings and exits 0, so this step could never fail.
      - name: Lint
        run: npm run lint

      # The published index is a generated file: these tests are what keeps it
      # consistent with the lexicon and the sessions. The transcripts are not
      # versioned, so CI cannot recompute it — only check it, which is why these
      # tests are not optional.
      - name: Unit tests
        run: npm test

      # `npm run build` runs `tsc -b` then `vite build`: a type error fails
      # this step.
      #
      # The site is served from morphologie.commutator.io, hence from the root:
      # assets must not be prefixed and BASE_PATH stays empty (vite.config.ts
      # then falls back to "/").
      # Without a custom domain, a project site lives under /<repo>/ and would
      # need BASE_PATH: /${{ github.event.repository.name }}/
      - name: Build
        run: npm run build

      # `enablement: true` provisions Pages if the repo has not enabled it.
      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    # A pull request does not deploy: it only runs the checks.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
